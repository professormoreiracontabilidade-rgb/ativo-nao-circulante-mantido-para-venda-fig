ElementById('gallerybtn').textContent=showGallery?'📖 Aula':'🗂️ Figurinhas';if(showGallery){document.getElementById('gallery').innerHTML=cards.map((c,i)=>`<button class="tile" onclick="go(${i+1})"><span class="em">${pictures[c.kind]||'📘'}</span><span class="sm">${i+1}. ${esc(c.title)}</span></button>`).join('')}}window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')go(index-1)});try{let saved=Number(localStorage.getItem('pm_cpc31_figurinhas'));if(Number.isInteger(saved)&&saved>=0&&saved<=cards.length)index=saved}catch(e){}render();</script></body></html>
